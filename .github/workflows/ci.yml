name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows, not Ubuntu: this is a Windows-only Electron app, and a lockfile
    # resolved on Windows omits Linux-only optional dependencies, which makes
    # `npm ci` fail on an Ubuntu runner for reasons unrelated to the code.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-vite build
